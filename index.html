function salesDate(v){let t=String(v??'').trim(),d;if(/^\d{4}-\d{2}$/.test(t))t+='-01';if(/^\d{4}-\d{2}-\d{2}(?:[ T].*)?$/.test(t))d=t.slice(0,10);else if(/^\d{1,2}\/\d{1,2}\/\d{4}(?:\s.*)?$/.test(t)){let [a,b,c]=t.split(/\s/)[0].split('/');d=c+'-'+b.padStart(2,'0')+'-'+a.padStart(2,'0')}else if(/^\d{5}(?:\.\d+)?$/.test(t)){let dt=new Date(Date.UTC(1899,11,30)+Math.floor(Number(t))*86400000);d=dt.toISOString().slice(0,10)}else return null;const dt=new Date(d+'T00:00:00Z');return !isNaN(dt)&&dt.toISOString().slice(0,10)===d&&+d.slice(0,4)>=2000&&+d.slice(0,4)<=2100?d:null}
function salesCents(v){let s=String(v??'').trim().replace(/R\$|\s/g,'');if(!s)return null;if(s.includes(',')){if(!/^-?(?:\d+|\d{1,3}(?:\.\d{3})+),\d{1,2}$/.test(s))return null;s=s.replace(/\./g,'').replace(',','.')}else if(!/^-?\d+(?:\.\d+)?$/.test(s))return null;let n=Number(s),c=Math.round(n*100);return Number.isSafeInteger(c)&&Math.abs(n*100-c)<1e-4?c:null}
function salesReadRows(rows){const alias=[['DATA','DATAVENDA','DATAEMISSAO','DTEMISSAO','DTVENDA','MES','COMPETENCIA'],['CODCLIENTE','CODIGOCLIENTE','CODCLI','CODIGOCLI','CODCLIENTEPRIME'],['CODPRODUTO','CODIGOPRODUTO','CODPROD','CODPRIME','CODIGOPROD'],['VALORLIQUIDO','VALORVENDA','VLVENDA','VLTOTAL','VALORVENDIDO','FATURAMENTOLIQUIDO','VALORLIQUIDOVENDA']];let header=-1,idx;for(let i=0;i<Math.min(rows.length,30);i++){let cols=rows[i].map(sNorm),j=alias.map(a=>cols.findIndex(c=>a.includes(c)));if(j.every(n=>n>=0)){header=i;idx=j;break}}if(header<0)throw Error('Cabeçalhos não reconhecidos. Necessário: Data, Código cliente, Código produto e Valor líquido.');const clients=new Set(db.lojas.map(l=>l.id)),out=[],errors=[];for(let i=header+1;i<rows.length;i++){const row=rows[i];if(!row.some(v=>String(v??'').trim()))continue;const [raw,client,prod,value]=idx.map(j=>row[j]);let data=salesDate(raw),loja=String(client??'').trim(),p=String(prod??'').trim(),centavos=salesCents(value);if(!data||!clients.has(loja)||!p||centavos===null){if(errors.length<8)errors.push('Linha '+(i+1)+': '+[!data?'data inválida':'',!clients.has(loja)?'cliente fora do cadastro ('+loja+')':'',!p?'produto vazio':'',centavos===null?'valor inválido':''].filter(Boolean).join(', '));continue}out.push({mes:data.slice(0,7),loja,prod:p,centavos})}if(errors.length)throw Error('Importação cancelada. '+errors.join(' • '));if(!out.length)throw Error('Nenhuma linha de venda encontrada.');return out}

async function previewSales(file){salesNotice='Importação desativada nesta demonstração pública. Não envie dados reais.';render();return;if(role()!=='Administrador'||!file)return;salesPending=null;salesNotice='Lendo relatório...';render();try{if(file.size>25*1024*1024)throw Error('Arquivo maior que 25 MB. Divida por mês.');let rows;if(/\.xlsx$/i.test(file.name))rows=await salesXlsx(file);else if(/\.csv$/i.test(file.name))rows=salesCSV(await file.text());else throw Error('Formato não suportado. Use XLSX ou CSV.');let result=salesReadRows(rows);if(role()!=='Administrador')return;salesPending={rows:result,months:[...new Set(result.map(r=>r.mes))].sort(),name:file.name};salesNotice=''}catch(e){salesNotice=e.message}if(role()==='Administrador')render()}

function salesTemplate(){if(role()!=='Administrador')return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeffData;Código cliente;Código produto;Valor líquido\r\n'],{type:'text/csv;charset=utf-8'}));a.download='Modelo_Importacao_Vendas_Prime.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function salesImportPanel(){if(role()!=='Administrador')return '';return `<section><h2>Importação de vendas realizadas</h2><p>Importe o relatório completo de vendas líquidas das Americanas (uma linha por item ou loja/produto/mês). Use o código do cliente Prime, não o número da loja Americanas. Devoluções devem vir com valor negativo.</p><p><small>Campos necessários: Data (ou mês), Código cliente, Código produto e Valor líquido. XLSX (primeira aba) ou CSV. Para outros layouts, será necessário adequar a leitura ao relatório real do Winthor.</small></p><div class="bar"><input id="salesFile" type="file" accept=".xlsx,.csv" onchange="previewSales(this.files[0])"><button onclick="salesTemplate()">Baixar modelo CSV</button></div><p>Meses disponíveis: ${db.mesesVendas.length?esc(db.mesesVendas.join(', ')):'Nenhum'}</p>${salesPending?`<div class="sales-preview"><b>Prévia: ${esc(salesPending.name)}</b><p>${salesPending.rows.length} linhas • ${salesPending.months.map(monthLabel).join(', ')} • ${brl(salesPending.rows.reduce((n,r)=>n+r.centavos,0))}</p><p>Esta importação substitui integralmente os meses presentes no arquivo, evitando duplicação ao atualizar. Lojas ausentes serão consideradas sem vendas nesses meses. O mês corrente pode conter vendas até a data da extração.</p><label><input type="checkbox" id="salesComplete" onchange="document.getElementById('confirmSales').disabled=!this.checked"> Confirmo que o relatório contém toda a base Americanas dos meses informados.</label><p><button id="confirmSales" class="red" disabled onclick="confirmSales()">Confirmar importação</button> <button onclick="salesPending=null;render()">Cancelar</button></p></div>`:''}<p role="status" class="sales-note">${esc(salesNotice)}</p><small>Dados de vendas mantidos nesta sessão de demonstração. Não são enviados ou gravados no servidor.</small></section>`}

function goalFor(month,id){return db.metasComerciais[month]?.[id]??null}
function goalMetrics(scope,month,actual){const values=scope.map(l=>goalFor(month,l.id)),defined=values.filter(v=>v!==null),sum=defined.reduce((a,b)=>a+b,0),complete=scope.length>0&&defined.length===scope.length;return {count:defined.length,total:scope.length,meta:defined.length?sum:null,complete,actual,pct:complete&&actual!==null&&sum>0?actual/sum*100:null,gap:complete&&actual!==null?Math.max(0,sum-actual):null}}
function goalPercent(p){return p.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}
function goalDashboard(scope,metrics,tile){const g=goalMetrics(scope,salesMonth,metrics.month),note=g.complete?'Meta cadastrada para todas as lojas do filtro':g.count?`Meta parcial • ${g.count}/${g.total} lojas cadastradas`:'Nenhuma meta cadastrada';const actualNote=g.actual===null?'Sem base de vendas do mês':'Vendas líquidas importadas';let progress=g.pct===null?'Atingimento indisponível: '+(!g.complete?'complete o cadastro das metas do filtro.':g.actual===null?'importe as vendas do mês.':'meta igual a zero.'):(g.pct>=100?'Meta atingida':'Acompanhamento do atingimento mensal');return `<section class="goal-section"><div class="goal-foot"><h2>Meta × realizado</h2><small>${esc(monthLabel(salesMonth))}</small></div><div class="goal-grid">${tile('Meta mensal',g.meta===null?'—':brl(g.meta),note,'goal-meta')}${tile('Realizado',g.actual===null?'—':brl(g.actual),actualNote,'goal-actual')}${tile('Atingimento',g.pct===null?'—':goalPercent(g.pct),'Realizado ÷ meta','goal-percent')}${tile('Falta para a meta',g.gap===null?'—':brl(g.gap),g.gap===0?'Meta alcançada':g.gap===null?'Aguardando dados completos':'Saldo restante','goal-gap')}</div>${g.pct!==null?`<div class="goal-progress ${g.pct>=100?'complete':''}" role="progressbar" aria-label="Atingimento da meta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.max(0,Math.min(100,g.pct))}"><div style="width:${Math.max(0,Math.min(100,g.pct))}%"></div></div>`:''}<div class="goal-foot"><small class="goal-status">${esc(progress)} • ${g.total} loja(s) no filtro.</small>${role()==='Administrador'?`<button onclick="goalNotice='';go('metas')">Cadastrar metas</button>`:''}</div></section>`}
function goalAdminPanel(a,table,tr){const covered=db.mesesVendas.includes(salesMonth),byStore=new Map();if(covered)for(const r of db.vendas){if(r.mes===salesMonth)byStore.set(r.loja,(byStore.get(r.loja)||0)+r.centavos)}return `<h1>Metas comerciais</h1><section class="goal-table"><p>Defina a meta de faturamento líquido de cada Americanas por mês, em reais. O realizado vem exclusivamente das vendas importadas. Campo vazio = meta não cadastrada; zero = meta explícita de R$ 0,00.</p><div class="bar"><label>Mês da meta<br><input type="month" id="goalMonth" value="${esc(salesMonth)}" onchange="goalNotice='';setDashboardMonth(this.value)"></label><small>${a.length} lojas disponíveis conforme o filtro de filial.</small></div>${table(['Código Prime','Loja','Cidade','Meta mensal (R$)','Realizado (R$)'],a.map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(l.nome)}</td><td>${esc(l.cidade)}</td><td><input type="text" inputmode="decimal" data-goal-id="${esc(l.id)}" aria-label="Meta da loja ${esc(l.nome)} ${esc(l.cidade)}" placeholder="Não cadastrada" value="${goalFor(salesMonth,l.id)===null?'':(goalFor(salesMonth,l.id)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}"></td><td>${covered?brl(byStore.get(l.id)||0):'—'}</td></tr>`).join(''))}<p id="goalNotice" role="status" class="goal-status">${esc(goalNotice)}</p><div class="bar"><button class="red" onclick="saveCommercialGoals()">Salvar metas do mês</button><button onclick="go('painel')">Voltar ao painel</button></div><small>Salve antes de trocar o mês ou a filial. Metas temporárias nesta sessão de demonstração, sem sincronização online.</small></section>`}
function saveCommercialGoals(){if(role()!=='Administrador'||page!=='metas')return;const ids=new Set(allowed().map(l=>l.id)),inputs=[...document.querySelectorAll('[data-goal-id]')],changes=[];let invalid=false;for(const input of inputs){input.removeAttribute('aria-invalid');const id=input.dataset.goalId;if(!ids.has(id))return;const raw=input.value.trim(),c=raw===''?null:salesCents(raw);if(raw!==''&&(c===null||c<0)){input.setAttribute('aria-invalid','true');invalid=true}else changes.push([id,c])}if(invalid){$('goalNotice').textContent='Corrija as metas destacadas. Use valores em reais não negativos, com até duas casas decimais. Nenhuma alteração foi salva.';return}const next={...(db.metasComerciais[salesMonth]||{})};for(const [id,c] of changes){if(c===null)delete next[id];else next[id]=c}db.metasComerciais[salesMonth]=next;goalNotice='Metas salvas para '+monthLabel(salesMonth)+' nesta sessão.';render()}
